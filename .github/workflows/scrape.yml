name: Daily Sunset Forecast Scraper

on:
  # schedule 已于 2026-08-28 关闭：私有仓库每小时 schedule 烧完了 2000 分钟/月配额，
  # 每次被 GitHub 账单拦截后发失败邮件。博客 /sunset 的实际数据源是公开仓库
  # krisaruz/zhuhai-sunset-monitor，本仓库未被任何下游引用，停掉零影响。
  # 需要恢复时把下面的 schedule 取消注释即可。
  # schedule:
  #   - cron: '5 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push committed changes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Runtime Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx ephem pydantic-settings sqlalchemy aiosqlite

      - name: Run Scraper
        env:
          SUNSET_FEISHU_WEBHOOK_URL: ${{ secrets.SUNSET_FEISHU_WEBHOOK_URL }}
          SUNSET_FEISHU_WEBHOOK_SECRET: ${{ secrets.SUNSET_FEISHU_WEBHOOK_SECRET }}
          # You can also customize default city or threshold here if needed
          SUNSET_NOTIFY_MIN_QUALITY: 0.2
        run: python run.py

      - name: Sync data to docs for GitHub Pages
        run: cp data/history.json data/map-data.json docs/data/

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/map-data.json data/history.json docs/data/
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "data: update sunset forecast and history [skip ci]"
            git push origin master
          else
            echo "No changes in forecast or history data. Skipping commit."
          fi
